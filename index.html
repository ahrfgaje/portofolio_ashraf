<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Animasi GIF</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
    }

    body {
      overflow-x: hidden;
    }

    .gif-container {
      width: 100%;
      margin: 0;
      padding: 0;
    }

    .gif-container img {
      display: block;
      width: 100%;
      max-width: 100%;
      height: auto;
      margin: 0;
      padding: 0;
    }
  </style>
</head>

<body>

  <div class="gif-container">

    <img src="animasi.gif" alt="Animasi GIF">

    <img src="animasi2.gif" alt="Animasi GIF 2">

    <img src="animasi1.gif" alt="Animasi GIF 1">

    <img src="animasi3.gif" alt="Animasi GIF 3">

  </div>

</body>
</html>
